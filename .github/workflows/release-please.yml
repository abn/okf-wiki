name: Release Please

# Versioning and releases. Release Please creates the release pull request and,
# once it merges, a draft release with the workflow GITHUB_TOKEN. A tag or
# release created that way starts no workflow, so the follow-up work is done
# here rather than left to triggers that would never fire: the binaries are
# attached to the draft, the draft is published, and only then does the semver
# check run and the image publish get dispatched.
#
# The order is not incidental. The repository publishes immutable releases,
# where the tag and the assets cannot change after publication, so every asset
# has to be attached while the release is still a draft. Publishing first, as
# the release used to be, makes the archive upload fail with HTTP 422.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Release binaries
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  publish-release:
    name: Publish the release
    needs: [release-please, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The draft holds the generated notes and, by now, the archives. This step
      # locks both, so it waits for the binaries job to finish.
      - name: Publish the draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false

  semver:
    name: Floating action tags
    needs: [release-please, publish-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/semver.yml

  publish:
    name: Publish the release image
    needs: [release-please, publish-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # A tag pushed by release-please starts no workflow, so the tag trigger in
      # publish.yml would not carry the release. A dispatch does, and its ref is
      # the tag, so publish.yml tags the image with the version.
      - name: Dispatch the image publish at the new tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$TAG"
