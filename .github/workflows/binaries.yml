name: Binaries

# Static release archives. release-please.yml calls this while the release is
# still a draft, then publishes it. Dispatch it with a tag to attach the
# archives to a release that is still a draft, for example after a failed run.
#
# Attaching is separate from publishing because this repository publishes
# immutable releases: once a release is published, its assets cannot be added,
# replaced or removed. A draft is the only place an archive can still land.
#
# The binary is pure Go and built with CGO off, so one Linux runner can build
# every target. macOS runners would add cost without adding capability.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the archives to.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the archives to.
        type: string
        required: true

permissions:
  contents: read

jobs:
  binaries:
    name: Build and attach
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mermaid/package-lock.json

      # The binary alone renders a bundle with a diagram only by reaching for
      # the CDN, so the archive carries the runtime beside it.
      - name: Build the diagram runtime
        run: |
          set -euo pipefail
          make vendor
          test -s mermaid/mermaid-bundle.min.mjs
          test -s mermaid/mermaid-bundle.min.js

      - name: Build the archives
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          version=${TAG#v}
          test -n "$version"
          mkdir -p dist

          targets=(
            linux/amd64 linux/arm64
            darwin/amd64 darwin/arm64
            windows/amd64 windows/arm64
          )

          for target in "${targets[@]}"; do
            os=${target%/*}
            arch=${target#*/}
            name=okf-wiki_${os}_${arch}
            stage=dist/$name

            bin=okf-wiki
            [ "$os" = windows ] && bin=okf-wiki.exe

            mkdir -p "$stage"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "$stage/$bin" ./cmd/okf-wiki

            # The release commit carries the version, so the native archive can
            # prove that the tag and the binary agree.
            if [ "$os/$arch" = linux/amd64 ]; then
              got=$("$stage/$bin" version)
              want="okf-wiki $version"
              if [ "$got" != "$want" ]; then
                printf 'binary reports %s, want %s\n' "$got" "$want" >&2
                exit 1
              fi
            fi

            cp LICENSE README.md THIRD-PARTY.md "$stage/"
            mkdir -p "$stage/mermaid"
            cp mermaid/mermaid-bundle.min.mjs mermaid/mermaid-bundle.min.js "$stage/mermaid/"
            test -s "$stage/mermaid/mermaid-bundle.min.js"
            test -s "$stage/mermaid/mermaid-bundle.min.mjs"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)

      - name: Attach the archives to the draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # The API answers 422 for a published immutable release. Say what that
          # means, since a dispatch against an old tag is the usual way here,
          # and keep the raw output for any other cause.
          if ! output=$(gh release upload \
            "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber 2>&1); then
            printf '%s\n' "$output" >&2
            case "$output" in
              *"immutable release"*)
                printf 'Archives attach to a draft release: %s is published and accepts no asset.\n' \
                  "$TAG" >&2 ;;
              *)
                printf 'No draft release accepted the archives for %s; check the tag and its state.\n' \
                  "$TAG" >&2 ;;
            esac
            exit 1
          fi

          # The publish job locks the release immediately after this one, and a
          # file missed here can never be added later. Check what landed against
          # what was built before the release is published.
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' > "$RUNNER_TEMP/attached.txt"

          (cd dist && stat -c '%n %s' -- *.tar.gz *.zip checksums.txt) \
            > "$RUNNER_TEMP/built.txt"
          test -s "$RUNNER_TEMP/built.txt"

          while read -r name size; do
            if ! grep -qxF "$name $size" "$RUNNER_TEMP/attached.txt"; then
              printf 'release %s does not carry asset %s at %s bytes\n' \
                "$TAG" "$name" "$size" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/built.txt"
