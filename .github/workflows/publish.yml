name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Both are repository-variable overridable so the image can be published
# elsewhere. REGISTRY is set next to IMAGE rather than parsed out of it: GitHub
# Actions expressions have no split(), so deriving it would need a shell step,
# and a value that must be kept in step with IMAGE is better stated twice.
env:
  IMAGE: ${{ vars.IMAGE_NAME || 'ghcr.io/abn/okf-wiki' }}
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 tracks ubuntu-latest. arm64 has no -latest label: GitHub ships
          # ubuntu-{22,24,26}.04-arm and states there are no plans for one, so
          # this leg stays pinned. Swapping it to ubuntu-latest would schedule
          # the arm64 build on an x64 runner.
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build native image
        run: make container/build IMAGE="okf-wiki:${{ matrix.arch }}"

      - name: Log in to the registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the per-arch image
        run: |
          set -euo pipefail
          podman push "okf-wiki:${{ matrix.arch }}" \
            "$IMAGE:build-${{ matrix.arch }}"

  manifest:
    name: Publish multiarch manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the manifest list from the pushed per-arch images
        run: |
          set -euo pipefail
          podman manifest create "$IMAGE:tmp"
          podman manifest add --arch amd64 --os linux "$IMAGE:tmp" \
            "docker://$IMAGE:build-amd64"
          podman manifest add --arch arm64 --os linux "$IMAGE:tmp" \
            "docker://$IMAGE:build-arm64"
          podman manifest inspect "$IMAGE:tmp"

      - name: Push :latest
        run: podman manifest push --all "$IMAGE:tmp" "docker://$IMAGE:latest"

      - name: Push the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: podman manifest push --all "$IMAGE:tmp" "docker://$IMAGE:${GITHUB_REF_NAME}"
