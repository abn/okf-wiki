<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 96" width="640" height="96" role="img" aria-labelledby="stages-title">
  <title id="stages-title">The four stages of a render, from bundle to search index</title>
  <rect width="640" height="96" fill="none"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <rect x="8"  y="24" width="132" height="48" rx="10" fill="#eef3ee" stroke="#3f7d52" stroke-width="1.5"/>
    <text x="74"  y="46" fill="#1d2b21">Bundle</text>
    <text x="74"  y="62" fill="#5c6b60" font-size="11">docs/*.md</text>

    <rect x="172" y="24" width="132" height="48" rx="10" fill="#eef3ee" stroke="#3f7d52" stroke-width="1.5"/>
    <text x="238" y="46" fill="#1d2b21">Parse</text>
    <text x="238" y="62" fill="#5c6b60" font-size="11">frontmatter, AST</text>

    <rect x="336" y="24" width="132" height="48" rx="10" fill="#eef3ee" stroke="#3f7d52" stroke-width="1.5"/>
    <text x="402" y="46" fill="#1d2b21">Render</text>
    <text x="402" y="62" fill="#5c6b60" font-size="11">themed shell</text>

    <rect x="500" y="24" width="132" height="48" rx="10" fill="#eef3ee" stroke="#3f7d52" stroke-width="1.5"/>
    <text x="566" y="46" fill="#1d2b21">Emit</text>
    <text x="566" y="62" fill="#5c6b60" font-size="11">pages, index, assets</text>
  </g>
  <g stroke="#3f7d52" stroke-width="1.5" fill="none">
    <path d="M140 48 h32" marker-end="url(#arrow)"/>
    <path d="M304 48 h32" marker-end="url(#arrow)"/>
    <path d="M468 48 h32" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3f7d52"/>
    </marker>
  </defs>
</svg>
