---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      # One gate, not a copy of the Makefile: gofmt, go vet, and tests.
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
      - id: no-em-dash
        name: no em-dashes
        # Scoped to text, not just markdown: the same rule covers the theme
        # assets and the Go sources, and a markdown-only scope left the
        # stylesheets and clients unchecked, which is where em-dashes had
        # already appeared. The character is built from a hex escape rather
        # than written literally, so this file does not match its own grep.
        # --binary-files=without-match keeps the woff2 fonts out of it.
        entry: >-
          bash -c 'dash=$(printf "\xe2\x80\x94");
          if grep -rn --binary-files=without-match "$dash" "$@";
          then echo "em-dash found in the file above"; exit 1; fi' --
        language: system
        files: '\.(md|go|css|js|html|ya?ml)$'
